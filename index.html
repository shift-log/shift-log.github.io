<head>
  <!--
    If you are serving your web app in a path other than the root, change the

    This is a placeholder for base href that will be replaced by the value of

  <!-- Start fetching the app while the page is still loading. -->
  <link rel="preload" href="main.dart.js" as="script">
  <!--
    What the app asks for a moment after it starts, fetched now instead (low
    priority, so the app itself keeps the bandwidth): the cloud-sync library.
    firebase_core_web loads it with import(), which picks these up. The
    Firebase version must stay the one firebase_core_web is pinned to;
    test/web_shell_test.dart checks it. sqlite3.wasm is deliberately not
    here: a worker fetches it, a preload costs a first visit 0.3 s at 10 Mbps.
  -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js" fetchpriority="low">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js" fetchpriority="low">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore-pipelines.js" fetchpriority="low">
  <style>
    /* Shown at once, until the app draws its first frame. */
    /* Playful's paper and chalkboard: the default style for new users. */
    :root { --bg: #FFFBF2; --fg: #1E2A3A; --muted: #FF8A3D; --bar: #F1E6D2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1F2A27; --fg: #F4F1E8; --muted: #FFB27A; --bar: #33403C; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      color: var(--fg); transition: opacity 250ms ease;
      /* Above the app while it fades out, so a greeting can be held. */
      z-index: 10;
    }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .name { font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
    #splash .bar {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      background: var(--bar); margin-top: 6px;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: var(--muted);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); }
                       to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: .5; }
    }
    #splash.done { opacity: 0; pointer-events: none; }

    /* The greeting a returning user sees at once (the app's own, drawn here:
       same colours, same motion, same 24px text). */
    #splash .greet { display: none; flex-direction: column; align-items: center; gap: 24px; }
    #splash.greeting > :not(.greet) { display: none; }
    #splash.greeting .greet { display: flex; }
    .greet svg { display: none; width: 132px; height: 132px; overflow: visible; }
    #splash[data-part="morning"] .morning,
    #splash[data-part="afternoon"] .afternoon,
    #splash[data-part="evening"] .evening { display: block; }
    .greet .text {
      font-size: 24px; font-weight: 800; letter-spacing: -0.4px;
      text-align: center; padding: 0 24px;
      animation: rise 800ms cubic-bezier(.215, .61, .355, 1) both;
    }
    .greet .rise { animation: sunrise 2.6s cubic-bezier(.215, .61, .355, 1) both; }
    .greet .spin { transform-origin: 66px 66px; animation: spin 2.6s linear infinite; }
    .greet .star { animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes sunrise { from { transform: translateY(39.6px); } to { transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: .675; } 25% { opacity: 1; } 75% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .greet .text, .greet .rise, .greet .spin, .greet .star { animation: none; }
    }
  </style>
  <script>
    // A shared-note link (/s/<id>, as opened from a chat) goes to the app's
    // own address, /#/s/<id>. GitHub Pages does this in 404.html; this covers
    // hosts that answer every path with this page.
    (function () {
      var p = location.pathname;
      if (/^\/s\/[A-Za-z0-9_-]{6,64}\/?$/.test(p))
        location.replace('/#' + p.replace(/\/$/, '') + location.search);
    })();
  </script>
  <script>
    // The app's own colours from last time (its style and light / dark),
    // so a reload doesn't flash a different colour before the app draws.
    try {
      var c = JSON.parse(localStorage.getItem('shiftlog.splash') || 'null');
      if (c) for (var k in c) {
        if (/^#[0-9a-f]{6}$/i.test(c[k]))
          document.documentElement.style.setProperty('--' + k, c[k]);
      }
    } catch (e) {}
  </script>
</head>

  <script>
    // Someone who has set the app up sees its greeting at once, as the app
    // does, instead of a loading screen and then the greeting. The app saves
    // its colours and the name for this (see rememberSplashColors) and, on
    // seeing the class below, goes straight to Home when it is ready.
    // Only on a plain launch: a reload on a page (#/notes) shows no greeting.
    (function () {
      try {
        var hash = location.hash;
        if (hash && hash !== '#' && hash !== '#/') return;
        var saved = JSON.parse(localStorage.getItem('shiftlog.splash') || 'null');
        if (!saved || typeof saved.greet !== 'string') return;
        var hour = new Date().getHours();
        var part = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
        var splash = document.getElementById('splash');
        splash.querySelector('.greet .text').textContent =
          'Good ' + part + (saved.greet ? ', ' + saved.greet : '');
        splash.setAttribute('data-part', part);
        splash.classList.add('greeting');
        window.__greetedAt = performance.now(); // flutter_bootstrap.js holds it
      } catch (e) {}
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
