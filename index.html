    If you are serving your web app in a path other than the root, change the

  <meta name="theme-color" content="#1F2A27" media="(prefers-color-scheme: dark)">

  <meta name="description" content="Track office hours, work-from-home days and leave.">

  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShiftLog">

  <title>ShiftLog</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="main.dart.js" as="script">
  <style>
    /* Shown at once, until the app draws its first frame. */
    /* Playful's paper and chalkboard: the default style for new users. */
    :root { --bg: #FFFBF2; --fg: #1E2A3A; --muted: #FF8A3D; --bar: #F1E6D2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1F2A27; --fg: #F4F1E8; --muted: #FFB27A; --bar: #33403C; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      color: var(--fg); transition: opacity 250ms ease;
    }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .name { font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
    #splash .bar {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      background: var(--bar); margin-top: 6px;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: var(--muted);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); }
                       to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: .5; }
    }
    #splash.done { opacity: 0; pointer-events: none; }
  </style>
  <script>
    // A shared-note link (/s/<id>, as opened from a chat) goes to the app's
    // own address, /#/s/<id>. GitHub Pages does this in 404.html; this covers
    // hosts that answer every path with this page.
    (function () {
      var p = location.pathname;
      if (/^\/s\/[A-Za-z0-9_-]{6,64}\/?$/.test(p))
        location.replace('/#' + p.replace(/\/$/, '') + location.search);
    })();
  </script>
  <script>
    // The app's own colours from last time (its style and light / dark),
    // so a reload doesn't flash a different colour before the app draws.
    try {
      var c = JSON.parse(localStorage.getItem('shiftlog.splash') || 'null');
      if (c) for (var k in c) {
        if (/^#[0-9a-f]{6}$/i.test(c[k]))
          document.documentElement.style.setProperty('--' + k, c[k]);
      }
    } catch (e) {}
  </script>
</head>
